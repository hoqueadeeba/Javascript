<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<h2>Methods and loops</h2>
	<p>Numbers 1 to 10</p>
	<p id="numbers"></p>
	<p id="random"></p>
	<p id="day"></p>

	<script>
		var text="";
		for (var i = 1; i <=10; i++) {
			text +=numbers[i] +"<br>";
		}
		document.getElementsBy("numbers").innerHTML= text;

		Math.random(){
			for (var i = 0; i <=100; i++) {
			text +=random[i] +"<br>";
		}
		document.getElementsBy("random").innerHTML= text;


		}


		var day;
		switch(new Date().getDay()){
		case 0:
			day="Sunday";
			break;

		case 1:
			day="Monday";
			break;

		case 2:
			day="Tuesday";
			break;
		case 3:
			day="Wednesday";
			break;
			case 4:
			day="Thursday";
			break;
			case 5:
			day="Friday";
			break;
		case 6:
			day="Saturday";
			break;
		}
		document.getElementById("day").innerHTML="Today is "+day;
	</script>

</body>
</html>
